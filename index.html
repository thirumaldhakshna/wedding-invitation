<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Join Online — Richard Philemon &amp; Rabecca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
:root{
  --ivory:#fdf6fa; --paper:#fffdfe; --line:rgba(184,137,63,.45); --gold:#a67c2e; --green:#4a2566; --muted:#7a6489; --purple:#7b3f98;
  --shadow:0 10px 30px rgba(74,37,102,.15);
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif; --script:'Pinyon Script','Snell Roundhand',cursive;
  color-scheme:light; box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{margin:0;min-height:100%;font-family:var(--serif);font-size:1.2rem;line-height:1.65;color:var(--green);overflow-x:hidden;
  background:linear-gradient(160deg,#fde0ec 0%,#ecdcf9 50%,#d8e7fb 100%) fixed}
main{max-width:620px;margin:0 auto;padding:3rem 1.25rem 4rem;text-align:center}
.script{font-family:var(--script);font-weight:400}
.kicker{font-size:1.05rem;letter-spacing:.14em;color:var(--gold);margin:0 0 .4rem}
h1{font-size:clamp(2.6rem,10vw,4rem);line-height:1.1;margin:.2rem 0 .4rem}
p{margin:.3rem 0}
.divider{display:flex;align-items:center;justify-content:center;gap:.8rem;color:var(--gold);margin:1rem auto 1.6rem;max-width:240px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:1.6rem 1.3rem;margin-top:1.2rem}
.label{font-size:1rem;letter-spacing:.14em;color:var(--gold);margin:0}
.val{font-size:clamp(1.8rem,8vw,2.6rem);font-weight:600;letter-spacing:.08em;margin:.2rem 0 .8rem;word-break:break-all;font-variant-numeric:tabular-nums}
.btn{display:inline-block;font:600 1.05rem var(--serif);padding:.7rem 1.6rem;border-radius:999px;border:1px solid var(--gold);background:var(--purple);color:#fff7fb;cursor:pointer;text-decoration:none;transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.btn.ghost{background:transparent;color:var(--green)}
.big{padding:.95rem 2.4rem;font-size:1.2rem}
.row{display:flex;flex-wrap:wrap;gap:.8rem;justify-content:center;margin-top:1.6rem}
.note{color:var(--muted);font-size:1.05rem}
#soon{display:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
</style>
</head>
<body>
<main>
  <p class="kicker">Join Us Online</p>
  <h1 class="script">Richard Philemon &amp; Rabecca</h1>
  <p>A Jehovah’s Witness Wedding Reception</p>
  <div class="divider">♥</div>

  <p style="font-size:1.5rem">Monday, December 21, 2026 · 11:00 AM IST</p>
  <p class="note" id="local"></p>

  <div class="card">
    <p class="label">ZOOM MEETING ID</p>
    <p class="val" id="zid">—</p>
    <button class="btn ghost" id="cid" type="button">Copy ID</button>
  </div>
  <div class="card">
    <p class="label">PASSCODE</p>
    <p class="val" id="zpw">—</p>
    <button class="btn ghost" id="cpw" type="button">Copy Passcode</button>
  </div>
  <p id="soon" class="note" style="margin-top:1.4rem">The Zoom details will be shared here soon.</p>

  <div class="row">
    <a class="btn big" id="join" href="#" target="_blank" rel="noopener" hidden>Join Zoom Meeting</a>
    <a class="btn ghost" id="back" href="https://claude.ai/artifact/RxoqM3QYtMwCE5yMAHp2uc">← Back to Invitation</a>
  </div>
</main>

<script>
/* ===== Zoom details — edit these three values ===== */
const ZOOM = {
  id:   '',   // e.g. '123 4567 8901'
  pass: '',   // e.g. 'abc123'
  link: ''    // optional full invite link; if empty, the link is built from the ID
};

const $ = id => document.getElementById(id);

/* Show the details, or a "coming soon" note while the values are empty */
if (ZOOM.id)   $('zid').textContent = ZOOM.id;
if (ZOOM.pass) $('zpw').textContent = ZOOM.pass;
if (!ZOOM.id && !ZOOM.pass) $('soon').style.display = 'block';
const joinUrl = ZOOM.link || (ZOOM.id ? 'https://zoom.us/j/' + ZOOM.id.replace(/\D/g, '') : '');
if (joinUrl) { $('join').href = joinUrl; $('join').hidden = false; }

/* Wedding time shown in the visitor's own time zone */
try {
  const t = new Date('2026-12-21T11:00:00+05:30');
  const local = new Intl.DateTimeFormat(undefined, { dateStyle: 'full', timeStyle: 'short' }).format(t);
  const zone = Intl.DateTimeFormat().resolvedOptions().timeZone;
  $('local').textContent = 'In your time (' + zone + '): ' + local;
} catch (e) { /* ignore */ }

/* Copy buttons */
function wire(btnId, getText, label) {
  const b = $(btnId);
  b.addEventListener('click', async () => {
    const txt = getText();
    if (!txt) { b.textContent = 'Not added yet'; setTimeout(() => b.textContent = label, 1600); return; }
    try { await navigator.clipboard.writeText(txt); b.textContent = 'Copied!'; }
    catch (e) { b.textContent = 'Press and hold to copy'; }
    setTimeout(() => b.textContent = label, 1800);
  });
}
wire('cid', () => ZOOM.id, 'Copy ID');
wire('cpw', () => ZOOM.pass, 'Copy Passcode');
</script>
</body>
</html>
